<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Учет Бюджета</title>
  
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2382/2382461.png">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen font-sans max-w-md mx-auto flex flex-col justify-between p-4">

  <div>
    <!-- Шапка и Табы -->
    <header class="flex justify-between items-center pb-3 border-b border-slate-800">
      <div class="flex gap-2">
        <button id="tabFormBtn" onclick="switchTab('form')" class="text-sm font-bold bg-emerald-500 text-slate-950 px-4 py-1.5 rounded-xl transition">➕ Запись</button>
        <button id="tabAnalyticsBtn" onclick="switchTab('analytics')" class="text-sm font-bold bg-slate-800 text-slate-400 px-4 py-1.5 rounded-xl transition">📊 Аналитика</button>
      </div>
      <button onclick="fetchData()" class="text-xs bg-slate-800 p-2 rounded-xl text-slate-300 active:bg-slate-700">🔄</button>
    </header>

    <!-- Остатки -->
    <div class="grid grid-cols-2 gap-3 my-4">
      <div class="bg-slate-800/80 p-3.5 rounded-2xl border border-slate-700/50">
        <span class="text-[11px] text-slate-400 block mb-0.5">Остаток на неделю</span>
        <div id="weekBalance" class="text-xl font-black text-emerald-400">0.00 €</div>
      </div>
      <div class="bg-slate-800/80 p-3.5 rounded-2xl border border-slate-700/50">
        <span class="text-[11px] text-slate-400 block mb-0.5">Остаток на месяц</span>
        <div id="monthBalance" class="text-xl font-black text-blue-400">0.00 €</div>
      </div>
    </div>

    <!-- Вкладка 1: Форма добавления + Операции -->
    <div id="tabFormView" class="space-y-5">
      <form id="expenseForm" onsubmit="addExpense(event)" class="bg-slate-800/50 p-4 rounded-2xl border border-slate-700/30 space-y-3">
        <h2 class="text-xs font-bold text-slate-400 uppercase tracking-wider">Добавить расход</h2>
        
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="text-[10px] text-slate-400 ml-1">Дата</label>
            <input type="date" id="expenseDate" required
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
          </div>
          <div>
            <label class="text-[10px] text-slate-400 ml-1">Сумма (€)</label>
            <input type="number" step="0.01" id="amount" placeholder="0.00" required
                   class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm font-bold text-white focus:outline-none focus:border-emerald-500">
          </div>
        </div>

        <div>
          <label class="text-[10px] text-slate-400 ml-1">Категория</label>
          <select id="categorySelect" required
                  class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
            <option value="">Загрузка категорий...</option>
          </select>
        </div>

        <div>
          <label class="text-[10px] text-slate-400 ml-1">Комментарий</label>
          <input type="text" id="comment" placeholder="Описание (необязательно)"
                 class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
        </div>

        <button type="submit" id="submitBtn"
                class="w-full bg-emerald-500 hover:bg-emerald-600 active:scale-95 transition text-slate-950 font-bold py-3 rounded-xl">
          Записать расход
        </button>
      </form>

      <!-- Последние операции -->
      <div>
        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Последние операции</h3>
        <div id="expensesList" class="space-y-2 max-h-60 overflow-y-auto pr-1">
          <div class="text-xs text-slate-500 text-center py-4">Загрузка...</div>
        </div>
      </div>
    </div>

    <!-- Вкладка 2: Аналитика -->
    <div id="tabAnalyticsView" class="hidden space-y-4">
      <div class="bg-slate-800/50 p-3.5 rounded-2xl border border-slate-700/30 space-y-3">
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="text-[10px] text-slate-400">Тип графика</label>
            <select id="chartType" onchange="updateAnalytics()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs">
              <option value="pie">Пай-чарт</option>
              <option value="bar">Столбцы</option>
            </select>
          </div>
          <div>
            <label class="text-[10px] text-slate-400">Группировка</label>
            <select id="groupBy" onchange="updateAnalytics()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs">
              <option value="category">Категории</option>
              <option value="comment">Комментарии</option>
            </select>
          </div>
          <div>
            <label class="text-[10px] text-slate-400">Период</label>
            <select id="periodFilter" onchange="updateAnalytics()" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-1.5 text-xs">
              <option value="all">Все время</option>
              <option value="month" selected>Этот месяц</option>
              <option value="week">Эта неделя</option>
            </select>
          </div>
        </div>
      </div>

      <div class="bg-slate-800/40 p-4 rounded-2xl border border-slate-800 flex justify-center">
        <canvas id="analyticsChart" class="max-h-64"></canvas>
      </div>

      <div id="analyticsSummary" class="space-y-1.5"></div>
    </div>
  </div>

  <script>
    // УКАЖИТЕ ВАШ SCRIPT URL
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyRb-aaGT0m7oTV_GDY66pc7csuUIYNZx-Fl8kWwIQ60FlL0kBbzKM9mYJQJpWOpyi6/exec';

    let globalData = { operations: [], categories: [] };
    let myChart = null;

    // Установка сегодняшней даты в поле по умолчанию
    document.getElementById('expenseDate').valueToDate = new Date();
    document.getElementById('expenseDate').value = new Date().toISOString().split('T')[0];

    async function fetchData() {
      try {
        const res = await fetch(SCRIPT_URL);
        globalData = await res.json();

        document.getElementById('weekBalance').textContent = Number(globalData.weekBalance).toFixed(2) + ' €';
        document.getElementById('monthBalance').textContent = Number(globalData.monthBalance).toFixed(2) + ' €';

        // Заполнение выпадающего списка категорий
        const catSelect = document.getElementById('categorySelect');
        catSelect.innerHTML = globalData.categories.map(c => `<option value="${c}">${c}</option>`).join('');

        // Рендер истории
        renderHistory();
        updateAnalytics();
      } catch (err) {
        console.error('Ошибка при загрузке:', err);
      }
    }

    function renderHistory() {
      const listEl = document.getElementById('expensesList');
      if (globalData.operations && globalData.operations.length > 0) {
        listEl.innerHTML = globalData.operations.map(item => `
          <div class="flex justify-between items-center bg-slate-800/40 p-3 rounded-xl text-sm border border-slate-800">
            <div>
              <div class="font-semibold text-slate-200">${item.category}</div>
              <div class="text-xs text-slate-400">${item.comment || '—'} <span class="text-[10px] text-slate-500">(${item.date})</span></div>
            </div>
            <div class="font-bold text-red-400">-${Number(item.amount).toFixed(2)} €</div>
          </div>
        `).join('');
      } else {
        listEl.innerHTML = '<div class="text-xs text-slate-500 text-center py-2">Нет записей</div>';
      }
    }

    async function addExpense(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const date = document.getElementById('expenseDate').value;
      const amount = document.getElementById('amount').value;
      const category = document.getElementById('categorySelect').value;
      const comment = document.getElementById('comment').value;

      btn.disabled = true;
      btn.textContent = 'Сохранение...';

      try {
        await fetch(SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ date, amount, category, comment })
        });

        document.getElementById('amount').value = '';
        document.getElementById('comment').value = '';
        setTimeout(fetchData, 1500);
      } catch (err) {
        alert('Ошибка при сохранении!');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Записать расход';
      }
    }

    function switchTab(tab) {
      const formView = document.getElementById('tabFormView');
      const analyticsView = document.getElementById('tabAnalyticsView');
      const formBtn = document.getElementById('tabFormBtn');
      const analyticsBtn = document.getElementById('tabAnalyticsBtn');

      if (tab === 'form') {
        formView.classList.remove('hidden');
        analyticsView.classList.add('hidden');
        formBtn.className = "text-sm font-bold bg-emerald-500 text-slate-950 px-4 py-1.5 rounded-xl transition";
        analyticsBtn.className = "text-sm font-bold bg-slate-800 text-slate-400 px-4 py-1.5 rounded-xl transition";
      } else {
        formView.classList.add('hidden');
        analyticsView.classList.remove('hidden');
        analyticsBtn.className = "text-sm font-bold bg-emerald-500 text-slate-950 px-4 py-1.5 rounded-xl transition";
        formBtn.className = "text-sm font-bold bg-slate-800 text-slate-400 px-4 py-1.5 rounded-xl transition";
        updateAnalytics();
      }
    }

    function updateAnalytics() {
      if (!globalData.operations) return;

      const chartType = document.getElementById('chartType').value;
      const groupBy = document.getElementById('groupBy').value;
      const period = document.getElementById('periodFilter').value;

      // Фильтрация операций
      let filtered = globalData.operations;
      if (period === 'month') {
        const now = new Date();
        const currentMonth = now.getMonth() + 1;
        filtered = filtered.filter(op => Number(op.month) === currentMonth);
      } else if (period === 'week') {
        // Простая фильтрация последней недели из записей
        const latestWeek = filtered[0] ? filtered[0].week : null;
        if (latestWeek) filtered = filtered.filter(op => op.week === latestWeek);
      }

      // Группировка
      const grouped = {};
      filtered.forEach(op => {
        const key = (groupBy === 'category' ? op.category : op.comment) || 'Без названия';
        grouped[key] = (grouped[key] || 0) + Number(op.amount);
      });

      const labels = Object.keys(grouped);
      const values = Object.values(grouped);

      // Рендер чарта
      const ctx = document.getElementById('analyticsChart').getContext('2d');
      if (myChart) myChart.destroy();

      myChart = new Chart(ctx, {
        type: chartType,
        data: {
          labels: labels,
          datasets: [{
            data: values,
            backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444', '#8b5cf6', '#ec4899', '#64748b']
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { labels: { color: '#94a3b8' } } }
        }
      });

      // Список с итоговыми суммами
      const summaryEl = document.getElementById('analyticsSummary');
      summaryEl.innerHTML = labels.map((l, i) => `
        <div class="flex justify-between items-center bg-slate-800/30 px-3 py-1.5 rounded-lg text-xs">
          <span class="text-slate-300">${l}</span>
          <span class="font-bold text-white">${values[i].toFixed(2)} €</span>
        </div>
      `).join('');
    }

    fetchData();
  </script>
</body>
</html>
